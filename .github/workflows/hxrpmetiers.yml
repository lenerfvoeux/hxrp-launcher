name: Mod hxrpmetiers

on:
  push:
    paths:
      - 'hxrpmetiers/**'
      - '.github/workflows/hxrpmetiers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hxrpmetiers
    steps:
      - uses: actions/checkout@v4

      # Java 8 pour compiler le mod (toolchain Azul du build.gradle), Java 25 pour faire tourner Gradle
      # (RetroFuturaGradle 2.x est compilé pour Java 25).
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: |
            8
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Banc d'essai des mini-jeux
        run: sh tools/test/banc.sh

      - name: Ressources du Hunter Virus (modèles, textures, noms)
        run: python3 tools/virus/verifier_ressources.py

      - name: Compiler le mod
        run: ./gradlew build --no-daemon --stacktrace -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64

      - name: Vérifier le jar
        run: |
          ls -l build/libs
          J=$(ls build/libs/*.jar | grep -v -- '-dev\|-sources')
          unzip -l "$J" > contenu.txt
          n() { grep -Ec "$1" contenu.txt; }
          echo "classes $(n '\.class$') · icônes $(n 'textures/items/.*\.png') · blocs $(n 'blockstates/.*\.json') · modèles $(n 'models/.*\.json')"
          test "$(n 'textures/items/.*\.png')" -ge 570
          test "$(n 'blockstates/.*\.json')" -ge 205
          test "$(n 'textures/items/virus/.*\.png')" -ge 205
          test "$(n 'data/virus/.*\.json')" -eq 4
          test "$(n 'textures/blocks/monde/cultures/.*\.png')" -ge 207
          test "$(n 'data/recolte\.json')" -eq 1
          unzip -p "$J" mcmod.info | grep -q '"version": "0.7.0"'
          # Jar final : les appels à Minecraft doivent être en noms SRG (func_…), et le bytecode en Java 8.
          unzip -p "$J" fr/lenerfvoeux/hxrp/metiers/block/BlockOriente.class | grep -aq 'func_'
          test "$(unzip -p "$J" fr/lenerfvoeux/hxrp/metiers/HxrpMetiers.class | od -An -tu1 -j7 -N1 | tr -d ' ')" = 52
          echo "jar OK : $J"

      - uses: actions/upload-artifact@v4
        with:
          name: hxrpmetiers-jar
          path: |
            hxrpmetiers/build/libs/*.jar
            !hxrpmetiers/build/libs/*-dev.jar
            !hxrpmetiers/build/libs/*-sources.jar
          if-no-files-found: error

  # Démarre un vrai serveur Forge (avec le jar produit ci-dessus) et un vrai client, et vérifie le journal.
  demarrage:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [serveur, client]
    defaults:
      run:
        working-directory: hxrpmetiers
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: |
            8
            25

      - uses: gradle/actions/setup-gradle@v4
        if: matrix.mode == 'client'

      - uses: actions/download-artifact@v4
        if: matrix.mode == 'serveur'
        with:
          name: hxrpmetiers-jar
          path: hxrpmetiers/livre

      - name: Démarrer un serveur Forge 1.12.2 avec le mod
        if: matrix.mode == 'serveur'
        run: bash tools/test/demarrage.sh serveur "$(ls livre/*.jar)"

      - name: Démarrer un client avec le mod
        if: matrix.mode == 'client'
        run: |
          mkdir -p ~/.gradle && echo 'org.gradle.java.installations.fromEnv=JAVA_HOME_8_X64' >> ~/.gradle/gradle.properties
          sudo apt-get update -q && sudo apt-get install -y -q xvfb x11-xserver-utils libgl1-mesa-dri
          xvfb-run -a -s '-screen 0 1280x720x24' bash tools/test/demarrage.sh client

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journal-${{ matrix.mode }}
          path: |
            hxrpmetiers/build/demarrage-*.log
            hxrpmetiers/build/serveur-test/logs/*.log
            hxrpmetiers/build/serveur-test/crash-reports/*
            hxrpmetiers/run/**/logs/*.log
            hxrpmetiers/run/**/crash-reports/*
          if-no-files-found: ignore

  # Un monde créé avec la v0.6.0 (le jar publié) rouvert avec ce jar : remappage des préparations renommées,
  # objets et blocs retirés effacés, aucun blocage au démarrage.
  migration:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hxrpmetiers
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 8

      - uses: actions/download-artifact@v4
        with:
          name: hxrpmetiers-jar
          path: hxrpmetiers/livre

      - name: Récupérer le jar publié de la v0.6.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download hxrp-extras-v1.5.0 --repo "${{ github.repository }}" --pattern 'hxrpmetiers-0_6_0.jar' --dir ancien

      - name: Rouvrir un monde v0.6.0 avec la nouvelle version
        run: JAVA_HOME_8_X64="$JAVA_HOME" bash tools/test/migration.sh ancien/hxrpmetiers-0_6_0.jar "$(ls livre/*.jar)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journal-migration
          path: |
            hxrpmetiers/build/migration.log
            hxrpmetiers/build/serveur-migration/logs/*.log
            hxrpmetiers/build/serveur-migration/crash-reports/*
          if-no-files-found: ignore
