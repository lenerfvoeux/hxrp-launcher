name: Mod hxrpphenix

on:
  push:
    paths:
      - 'hxrpphenix/**'
      - '.github/workflows/hxrpphenix.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GECKOLIB_URL: https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/software/bernie/geckolib/geckolib-forge-1.12.2/3.0.31/geckolib-forge-1.12.2-3.0.31.jar

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hxrpphenix
    steps:
      - uses: actions/checkout@v4

      # Java 8 pour compiler le mod, Java 25 pour faire tourner Gradle (RetroFuturaGradle 2.x).
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: |
            8
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Ressources du Phénix (modèle, animations, textures, sons, noms)
        run: |
          python3 -c 'import PIL' 2>/dev/null || pip install -q pillow
          python3 tools/phenix/verifier.py

      - name: GeckoLib 3.0.31 disponible
        run: |
          curl -fsSIL "$GECKOLIB_URL" | head -5
          curl -fsSL -o geckolib.jar "$GECKOLIB_URL"
          unzip -l geckolib.jar | grep -E 'software/bernie/geckolib3/(GeckoLib|renderers/geo/GeoEntityRenderer)\.class'
          # le jar publié doit être en noms SRG (comme celui du serveur)
          unzip -p geckolib.jar software/bernie/geckolib3/renderers/geo/GeoEntityRenderer.class | grep -aq 'func_'

      - name: Compiler le mod
        run: ./gradlew build --no-daemon --stacktrace -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64

      - name: Vérifier le jar
        run: |
          ls -l build/libs
          J=$(ls build/libs/*.jar | grep -v -- '-dev\|-sources')
          unzip -l "$J" > contenu.txt
          n() { grep -Ec "$1" contenu.txt; }
          echo "classes $(n '\.class$') · textures $(n 'textures/.*\.png') · sons $(n 'sounds/.*\.ogg')"
          test "$(n 'assets/hxrpphenix/geo/phenix\.geo\.json')" -eq 1
          test "$(n 'assets/hxrpphenix/animations/phenix\.animation\.json')" -eq 1
          test "$(n 'assets/hxrpphenix/textures/entity/phenix_[0-3]\.png')" -eq 4
          test "$(n 'assets/hxrpphenix/sounds/.*\.ogg')" -eq 13
          test "$(n 'software/bernie')" -eq 0   # GeckoLib n'est pas embarqué : il est déjà sur le serveur
          unzip -p "$J" mcmod.info | grep -q '"version": "1.0.0"'
          # Jar final : appels à Minecraft en noms SRG (func_…/field_…), bytecode Java 8
          unzip -p "$J" fr/lenerfvoeux/hxrp/phenix/entite/EntityPhenix.class | grep -aq 'func_'
          unzip -p "$J" fr/lenerfvoeux/hxrp/phenix/entite/EntityPhenix.class | grep -aq 'field_'
          test "$(unzip -p "$J" fr/lenerfvoeux/hxrp/phenix/HxrpPhenix.class | od -An -tu1 -j7 -N1 | tr -d ' ')" = 52
          cp geckolib.jar build/libs/geckolib-forge-1.12.2-3.0.31.jar
          echo "jar OK : $J"

      - uses: actions/upload-artifact@v4
        with:
          name: hxrpphenix-jar
          path: |
            hxrpphenix/build/libs/*.jar
            !hxrpphenix/build/libs/*-dev.jar
            !hxrpphenix/build/libs/*-sources.jar
          if-no-files-found: error

  # Vrai serveur Forge (jar livré + GeckoLib) avec un scénario de combat, et vrai client.
  demarrage:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [serveur, client]
    defaults:
      run:
        working-directory: hxrpphenix
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: |
            8
            25

      - uses: gradle/actions/setup-gradle@v4
        if: matrix.mode == 'client'

      - uses: actions/download-artifact@v4
        if: matrix.mode == 'serveur'
        with:
          name: hxrpphenix-jar
          path: hxrpphenix/livre

      - name: Démarrer un serveur Forge 1.12.2 avec le Phénix
        if: matrix.mode == 'serveur'
        run: bash tools/test/demarrage.sh serveur "$(ls livre/hxrpphenix-*.jar)" "$(ls livre/geckolib-*.jar)"

      - name: Démarrer un client avec le Phénix
        if: matrix.mode == 'client'
        run: |
          mkdir -p ~/.gradle && echo 'org.gradle.java.installations.fromEnv=JAVA_HOME_8_X64' >> ~/.gradle/gradle.properties
          sudo apt-get update -q && sudo apt-get install -y -q xvfb x11-xserver-utils libgl1-mesa-dri
          xvfb-run -a -s '-screen 0 1280x720x24' bash tools/test/demarrage.sh client

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journal-phenix-${{ matrix.mode }}
          path: |
            hxrpphenix/build/demarrage-*.log
            hxrpphenix/build/serveur-test/logs/*.log
            hxrpphenix/build/serveur-test/crash-reports/*
            hxrpphenix/run/**/logs/*.log
            hxrpphenix/run/**/crash-reports/*
          if-no-files-found: ignore
